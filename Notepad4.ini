[Notepad4]
; Custom Notepad4 settings

[Settings]
; Disable auto-completion (word completion, tag closing, document scanning)
AutoCompleteOption=0

; Disable only the auto-inserted space after a comma (bit 128).
; AutoInsertMask is one integer covering nine behaviours, so there is no
; per-option key: 383 is the 511 default minus 128, leaving bracket and quote
; auto-closing on. Use 0 to disable all nine instead.
;
; Note: Notepad4 omits any setting equal to its default when it rewrites this
; file on exit, and the default is 511 (everything on). An absent AutoInsertMask
; therefore means "all on" -- which is why the comma space appears to come back.
AutoInsertMask=383

