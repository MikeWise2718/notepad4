[Notepad4]
; Custom Notepad4 settings

[Settings]
; Disable auto-completion (word completion, tag closing, document scanning)
AutoCompleteOption=0

; Disable both auto-inserted spaces: after a comma (bit 128) and after a
; line comment marker (bit 256). AutoInsertMask is one integer covering nine
; behaviours, so there is no per-option key: 127 is the 511 default minus
; 128 and 256, leaving all seven bracket and quote auto-closes on.
; Use 0 to disable all nine instead.
;
; Bit 256 controls whether toggling a line comment yields "// text" or
; "//text" -- see EditToggleLineComments() in src/Edit.cpp.
;
; Note: Notepad4 omits any setting equal to its default when it rewrites this
; file on exit, and the default is 511 (everything on). An absent
; AutoInsertMask therefore reads back as all-enabled -- which is why these
; spaces appear to come back on their own.
AutoInsertMask=127

