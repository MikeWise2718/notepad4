[Notepad4]
; Custom Notepad4 settings

[Settings]
; Disable auto-completion (word completion, tag closing, document scanning)
AutoCompleteOption=0

; Disable ALL auto-insert. 0 clears every bit of AutoInsertMask, whose
; default is 511: the two auto-inserted spaces (after a comma, bit 128,
; and after a line comment marker, bit 256) and all seven bracket and
; quote auto-closes -- () {} [] <> "" '' and backticks.
;
; Rationale: typing the closing character is automatic muscle memory, so
; auto-closing gets in the way rather than helping.
;
; Note: Notepad4 omits any setting equal to its default when it rewrites
; this file on exit. 0 is not the default, so it persists correctly; an
; absent AutoInsertMask would instead read back as 511, all enabled.
AutoInsertMask=0

